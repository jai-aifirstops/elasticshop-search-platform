spring.application.name=ecommerce-search-api

server.port=8080

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Do not expose internal exception details through default error responses
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Elasticsearch
elasticsearch.url=${ELASTICSEARCH_URL:http://localhost:9200}
elasticsearch.index=products

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/ecommerce}
spring.datasource.username=${DB_USERNAME:ecommerce}
spring.datasource.password=${DB_PASSWORD:ecommerce_dev_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=product-search-indexer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.product-topic=product-events

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Common metric tag
management.metrics.tags.application=elasticshop-search-api

# Application info
management.info.env.enabled=true

info.app.name=ElasticShop Search API
info.app.description=E-commerce search platform using PostgreSQL, Kafka, Redis and Elasticsearch
info.app.version=7

# Logging
logging.level.root=INFO
logging.level.com.jaideep.ecommerce=INFO

# Transactional Outbox
app.outbox.poll-delay-ms=1000
app.outbox.initial-delay-ms=2000
