name: ElasticShop CI

on:

  push:
    branches:
      - master
      - main

  workflow_dispatch:

  pull_request:
permissions:
  contents: read


jobs:

  backend:

    name: Backend Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6

        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B clean verify


  frontend:

    name: Frontend Build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7

        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  docker:

    name: Docker Images

    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t elasticshop-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t elasticshop-frontend:ci ./frontend