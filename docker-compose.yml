services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    container_name: es01

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g

    ports:
      - "9200:9200"
      - "9300:9300"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data


  postgres:
    image: postgres:17.11
    container_name: ecommerce-postgres

    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_dev_password

    ports:
      - "55432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ecommerce -d ecommerce
      interval: 5s
      timeout: 5s
      retries: 20


  kafka:
    image: apache/kafka:4.0.2
    hostname: kafka
    container_name: ecommerce-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 30


  redis:
    image: redis:8.10.1-alpine
    container_name: ecommerce-redis

    ports:
      - "127.0.0.1:6379:6379"

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 20


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ecommerce-backend

    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200

      DB_URL: jdbc:postgresql://postgres:5432/ecommerce
      DB_USERNAME: ecommerce
      DB_PASSWORD: ecommerce_dev_password

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

      REDIS_HOST: redis
      REDIS_PORT: 6379

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:

      elasticsearch:
        condition: service_started

      postgres:
        condition: service_healthy

      kafka:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: on-failure


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: ecommerce-frontend

    ports:
      - "127.0.0.1:5173:80"

    depends_on:
      - backend

    restart: unless-stopped


  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: ecommerce-prometheus

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

    depends_on:
      - backend


  grafana:
    image: grafana/grafana:13.1.4
    container_name: ecommerce-grafana

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/elasticshop-overview.json

    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus


volumes:

  elasticsearch-data:

  postgres-data:

  prometheus-data:

  grafana-data: